name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: brew install tmux && brew install --cask claude-code
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build:mac
        env:
          # Ad-hoc signing (identity '-') uses no secret, so pull requests are signed like the release.
          CSC_FOR_PULL_REQUEST: true
      - run: npx playwright test
        env:
          GH_TOKEN: ${{ github.token }}
